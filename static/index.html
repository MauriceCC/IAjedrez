<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAjedrez · Estudio local</title><link rel="stylesheet" href="/static/style.css">
<style>.tools{padding:14px;display:grid;gap:10px}.tools textarea{width:100%;min-height:90px}.square{border:0;padding:0;aspect-ratio:1}.selected-square{outline:3px solid #1d62d8;outline-offset:-3px}.target{box-shadow:inset 0 0 0 4px #377caa}.result-area p{line-height:1.65;white-space:pre-wrap}.layout{align-items:start}.tree-scroll{max-height:55vh}.board-main{min-height:420px}select{padding:8px}#status{padding:10px 18px;margin:0;background:#eaf2ff}button:disabled{opacity:.5}.chessboard{width:100%}.board-frame{display:block}.query-entry{border-left:2px solid #9cbce8;padding:8px;margin:8px 0}.menu-options{display:grid;gap:7px}.menu-options[hidden]{display:none}</style>
<header class="topbar"><div class="brand"><span class="logo">♙</span><div><h1>IAjedrez / Estudio local</h1><small>Comprende, pregunta y prueba</small></div></div><a href="/prototype" style="color:white">Ver prototipo</a></header>
<p id="status" role="status" aria-live="polite">Cargando…</p>
<main class="layout"><section class="panel tree-panel"><header class="panel-header"><h2 class="panel-title">Jugadas y variantes</h2></header><div class="tools"><button id="sample" class="small-button">Cargar partida de ejemplo</button><label for="pgn">Importar PGN · línea principal</label><textarea id="pgn" placeholder="1. e4 e5 2. Nf3 Nc6 …"></textarea><button id="import" class="small-button">Importar</button><button id="export" class="small-button">Guardar estudio JSON</button><label>Restaurar estudio <input type="file" id="restore" accept="application/json"></label></div><div id="tree" class="tree-scroll"></div></section>
<section class="panel board-panel"><header class="panel-header"><h2 class="panel-title">Posición de la partida</h2><span id="turn"></span></header><div class="board-main"><div class="board-frame"><div id="board" class="chessboard" aria-label="Tablero de ajedrez"></div></div><p id="board-help" class="subtle">Selecciona una jugada para estudiar su posición.</p></div><div class="board-controls"><button id="prev" class="nav-arrow" aria-label="Jugada anterior">‹</button><strong id="move-label"></strong><button id="next" class="nav-arrow" aria-label="Jugada siguiente">›</button></div><div class="tools"><label>Promoción <select id="promotion"><option value="q">Dama</option><option value="r">Torre</option><option value="b">Alfil</option><option value="n">Caballo</option></select></label><button id="return" class="small-button">Volver a la posición original</button></div></section>
<section class="panel right-panel"><header class="right-head"><h2 id="title">Análisis</h2><button id="toggle" class="change-view" aria-expanded="false">Otras respuestas ▾</button></header><div id="menu" class="tools menu-options" hidden><button data-view="advice">Consejos</button><button data-view="references">Referencias</button><button data-view="chain">Cadena</button><button data-view="learn">Aprende</button></div><div class="tools"><button id="analyze" class="send">Analizar posición con Stockfish</button><button id="summary" class="small-button">Volver al análisis</button></div><div id="results" class="result-area"></div><form id="ask" class="composer"><label for="question">Tu consulta · vinculada a esta posición</label><div class="compose-controls"><textarea id="question" class="question" required maxlength="2000"></textarea><button class="send">Enviar ↗</button></div><p class="composer-tip">Tutor local con Ollama. Sus explicaciones pueden equivocarse; contrasta las variantes.</p></form></section></main><script src="/static/app.js"></script><script src="/static/chat-input.js"></script></html>
